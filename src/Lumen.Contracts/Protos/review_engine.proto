syntax = "proto3";

package lumen.v1;

option csharp_namespace = "Lumen.Contracts";

import "google/protobuf/timestamp.proto";

// The desktop client <-> local review engine boundary (TDD §47–48).
service ReviewEngine {
  rpc Ping (PingRequest) returns (PingReply);

  // Opens (or re-attaches to) a pull request and streams its analysis. Late subscribers receive a replay.
  rpc WatchPullRequest (WatchPullRequestRequest) returns (stream PullRequestEvent);

  rpc GetFileDiff (GetFileDiffRequest) returns (FileDiff);

  // A file at the PR head, e.g. to open a precedent example in full.
  rpc GetSourceFile (GetSourceFileRequest) returns (SourceFile);

  rpc SetReviewPointState (SetReviewPointStateRequest) returns (SetReviewPointStateReply);

  rpc PostReviewComment (PostReviewCommentRequest) returns (PostReviewCommentReply);

  // Ticks or clears GitHub's per-file "Viewed" checkbox for the signed-in user.
  rpc SetFileViewed (SetFileViewedRequest) returns (SetFileViewedReply);

  // Clears (or restores) a triage group, e.g. "Renamed `Foo`→`Bar`", for this pull request. Stored like dismissals.
  rpc SetTriageGroupAcknowledged (SetTriageGroupAcknowledgedRequest) returns (SetTriageGroupAcknowledgedReply);

  // Connections (TDD §39). Checking status spends no usage. Keys go to the platform credential store and are never
  // returned or logged.
  rpc GetConnections (GetConnectionsRequest) returns (Connections);

  rpc SetOpenRouterKey (SetOpenRouterKeyRequest) returns (Connections);

  rpc RemoveOpenRouterKey (RemoveOpenRouterKeyRequest) returns (Connections);

  // Saved to settings.json and applied to the next JEV call or investigation, without a restart.
  rpc UpdateConnectionSettings (ConnectionSettings) returns (Connections);

  // Review settings: global defaults in settings.json, each repository's overrides beside it. They apply to the next
  // analysis of a pull request; nothing re-runs on its own (the app offers Re-analyse).
  rpc GetReviewSettings (ReviewSettingsRequest) returns (ReviewSettingsReply);

  rpc UpdateReviewSettings (UpdateReviewSettingsRequest) returns (ReviewSettingsReply);
}

message PingRequest {}

message PingReply {
  string version = 1;
  int32 process_id = 2;
}

message PullRequestRef {
  string owner = 1;
  string name = 2;
  int32 number = 3;
}

message WatchPullRequestRequest {
  PullRequestRef pull_request = 1;
  // Re-fetch from GitHub even if an analysis for this PR is already running or complete.
  bool refresh = 2;
}

message PullRequestEvent {
  oneof event {
    AnalysisProgress progress = 1;
    PullRequestSnapshot snapshot = 2;
    ReviewPoint review_point_added = 3;
    ReviewPointStateChanged review_point_state_changed = 4;
    ConventionsFound conventions = 5;
    AnalysisComplete complete = 6;
    AnalysisFailed failed = 7;
    // A review point already sent, replaced in full (e.g. after an investigation added evidence).
    ReviewPoint review_point_updated = 8;
    InvestigationStatus investigation_status = 9;
    FileViewed file_viewed = 10;
    // Where to spend attention, per hunk. Sent once per analysis, after the snapshot and before review points.
    TriageReady triage_ready = 11;
    TriageGroupAcknowledged triage_group_acknowledged = 12;
  }
}

// A triage group was acknowledged or restored after TriageReady was sent.
message TriageGroupAcknowledged {
  string group_id = 1;
  bool acknowledged = 2;
}

message SetTriageGroupAcknowledgedRequest {
  PullRequestRef pull_request = 1;
  string group_id = 2;
  bool acknowledged = 3;
}

message SetTriageGroupAcknowledgedReply {}

// A file's "Viewed" checkbox changed after the snapshot was sent.
message FileViewed {
  string path = 1;
  bool viewed = 2;
}

// Background investigations; may continue after AnalysisComplete (TDD §49: at most "Analysing N areas…").
message InvestigationStatus {
  int32 active = 1;
  // Why investigations are not running, when they were wanted but could not start (e.g. "Not signed in").
  string detail = 2;
}

message AnalysisProgress {
  string stage = 1;
  string message = 2;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_MODIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_DELETED = 2;
  FILE_CHANGE_KIND_RENAMED = 3;
}

message ChangedFileSummary {
  string path = 1;
  string old_path = 2;
  FileChangeKind kind = 3;
  int32 additions = 4;
  int32 deletions = 5;
  bool is_binary = 6;
  bool is_mechanical = 7;
  string mechanical_reason = 8;
  // The viewer ticked "Viewed" on GitHub and the file has not changed since.
  bool is_viewed = 9;
  // Changed lines per triage tier. Empty in the snapshot; filled in the files TriageReady re-sends.
  TierLines tier_lines = 10;
}

// Changed lines (added plus removed) per triage tier.
message TierLines {
  int32 critical = 1;
  int32 worth_a_look = 2;
  int32 skim = 3;
  int32 skip = 4;
}

// What kind of change a hunk is. The zero value is the conservative one: an unset class is never mechanical.
enum ChangeClass {
  CHANGE_CLASS_BEHAVIOUR_CHANGE = 0;
  CHANGE_CLASS_NEW_CODE = 1;
  CHANGE_CLASS_FORMATTING = 2;
  CHANGE_CLASS_COMMENTS_ONLY = 3;
  CHANGE_CLASS_IMPORTS_ONLY = 4;
  CHANGE_CLASS_RENAME = 5;
  CHANGE_CLASS_MOVE = 6;
  CHANGE_CLASS_RIPPLE = 7;
  CHANGE_CLASS_GENERATED = 8;
}

// Where a reviewer should spend attention. The zero value is the conservative one: an unset tier is never Skip.
enum TriageTier {
  TRIAGE_TIER_WORTH_A_LOOK = 0;
  TRIAGE_TIER_CRITICAL = 1;
  TRIAGE_TIER_SKIM = 2;
  TRIAGE_TIER_SKIP = 3;
}

// One hunk (or part of one). Lines are 1-based and inclusive; 0 when the side has no lines.
message HunkTriage {
  string path = 1;
  int32 old_start = 2;
  int32 old_end = 3;
  int32 new_start = 4;
  int32 new_end = 5;
  ChangeClass change_class = 6;
  TriageTier tier = 7;
  // In words, e.g. "pure rename `Foo`→`Bar`". Never a score.
  repeated string reasons = 8;
  int32 changed_lines = 9;
  // Empty when the hunk is in no group.
  string group_id = 10;
}

// Hunks that are one idea across the pull request; members are the hunks carrying this group_id.
message TriageGroup {
  string id = 1;
  ChangeClass change_class = 2;
  string title = 3;
  int32 member_count = 4;
  int32 changed_lines = 5;
  bool acknowledged = 6;
}

message TriageSummary {
  // e.g. "19,700 lines changed: 14,100 proven mechanical, 3,200 new code, 2,400 changing existing behaviour".
  string text = 1;
  int32 total_lines = 2;
  // Mechanical and proven: a mechanical class in Skip.
  int32 mechanical_lines = 3;
  int32 new_code_lines = 4;
  int32 behaviour_change_lines = 5;
  TierLines tier_lines = 6;
  // A mechanical class left above Skip, e.g. ripple call sites or a move into another type.
  int32 likely_mechanical_lines = 7;
}

message TriageReady {
  repeated HunkTriage hunks = 1;
  repeated TriageGroup groups = 2;
  TriageSummary summary = 3;
  // The snapshot's files again, with tier_lines filled; the client takes tier_lines from here by path.
  repeated ChangedFileSummary files = 4;
}

message PullRequestSnapshot {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  string state = 4;
  bool is_draft = 5;
  string base_ref = 6;
  string head_ref = 7;
  string url = 8;
  string body = 9;
  string base_sha = 10;
  string head_sha = 11;
  string merge_base_sha = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated ChangedFileSummary files = 14;
  string viewer_login = 15;
  int32 review_thread_count = 16;
}

message GetFileDiffRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
}

enum DiffLineKind {
  DIFF_LINE_KIND_CONTEXT = 0;
  DIFF_LINE_KIND_ADDED = 1;
  DIFF_LINE_KIND_REMOVED = 2;
}

message DiffLine {
  DiffLineKind kind = 1;
  // 0 when the line does not exist on that side.
  int32 old_number = 2;
  int32 new_number = 3;
  string text = 4;
}

message DiffHunk {
  int32 old_start = 1;
  int32 old_count = 2;
  int32 new_start = 3;
  int32 new_count = 4;
  string header = 5;
  repeated DiffLine lines = 6;
}

message FileDiff {
  string path = 1;
  repeated DiffHunk hunks = 2;
}

message GetSourceFileRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
}

message SourceFile {
  string path = 1;
  string text = 2;
  bool exists = 3;
}

message CodeLocation {
  string path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  string symbol = 4;
}

enum ReviewSeverity {
  REVIEW_SEVERITY_LOW = 0;
  REVIEW_SEVERITY_MEDIUM = 1;
  REVIEW_SEVERITY_HIGH = 2;
}

enum ReviewPointState {
  REVIEW_POINT_STATE_VISIBLE = 0;
  REVIEW_POINT_STATE_EXAMINED = 1;
  REVIEW_POINT_STATE_DISMISSED = 2;
  REVIEW_POINT_STATE_COMMENTED = 3;
  REVIEW_POINT_STATE_RESOLVED = 4;
}

enum EvidenceState {
  EVIDENCE_STATE_UNVERIFIED = 0;
  EVIDENCE_STATE_VERIFIED = 1;
  EVIDENCE_STATE_STRONG = 2;
  EVIDENCE_STATE_CONFLICTING = 3;
  EVIDENCE_STATE_HUMAN_DECISION = 4;
}

message PrecedentExample {
  CodeLocation location = 1;
  string type_name = 2;
  string snippet = 3;
  int32 snippet_start_line = 4;
}

message Evidence {
  string id = 1;
  // e.g. "RepositoryPrecedent", "StaticAnalysis".
  string source = 2;
  // Provenance: the component that produced it, e.g. "peer-pattern/v1".
  string producer = 3;
  string summary = 4;
  bool is_counter_evidence = 5;
  google.protobuf.Timestamp created_at = 6;
  string convention = 7;
  int32 supporting = 8;
  int32 peer_count = 9;
  repeated PrecedentExample examples = 10;
  CodeLocation location = 11;
}

message ComparisonSide {
  string title = 1;
  string caption = 2;
  CodeLocation source = 3;
  string snippet = 4;
  int32 snippet_start_line = 5;
  repeated int32 highlight_lines = 6;
  repeated string points = 7;
}

message ComparisonSurface {
  ComparisonSide current = 1;
  ComparisonSide precedent = 2;
}

message ReviewPoint {
  string id = 1;
  // ReviewPointType name, e.g. "PatternDeviation".
  string type = 2;
  ReviewSeverity severity = 3;
  ReviewPointState state = 4;
  EvidenceState evidence_state = 5;
  string title = 6;
  string summary = 7;
  string why_it_matters = 8;
  string suggested_comment = 9;
  CodeLocation anchor = 10;
  repeated CodeLocation other_locations = 11;
  repeated Evidence evidence = 12;
  ComparisonSurface comparison = 13;
  double priority = 14;
  string routing_reason = 15;
}

message ReviewPointStateChanged {
  string review_point_id = 1;
  ReviewPointState state = 2;
}

message Convention {
  string id = 1;
  string statement = 2;
  string peer_group = 3;
  int32 supporting = 4;
  int32 peer_count = 5;
  repeated CodeLocation examples = 6;
}

message ConventionsFound {
  repeated Convention conventions = 1;
}

message AnalysisComplete {
  int32 review_point_count = 1;
  int32 suppressed_count = 2;
  int64 duration_ms = 3;
}

message AnalysisFailed {
  string message = 1;
  bool is_authentication = 2;
}

message SetReviewPointStateRequest {
  PullRequestRef pull_request = 1;
  string review_point_id = 2;
  ReviewPointState state = 3;
}

message SetReviewPointStateReply {}

message PostReviewCommentRequest {
  PullRequestRef pull_request = 1;
  // Optional: the review point this comment responds to; it is marked Commented.
  string review_point_id = 2;
  string path = 3;
  int32 line = 4;
  string body = 5;
}

message PostReviewCommentReply {
  int64 comment_id = 1;
  string url = 2;
}

message SetFileViewedRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  bool viewed = 3;
}

message SetFileViewedReply {}

message GetConnectionsRequest {}

message SetOpenRouterKeyRequest {
  string key = 1;
}

message RemoveOpenRouterKeyRequest {}

enum ConnectionState {
  // Turned off in settings; nothing is sent.
  CONNECTION_STATE_OFF = 0;
  // Allowed, but no credential or sign-in yet.
  CONNECTION_STATE_NOT_CONNECTED = 1;
  CONNECTION_STATE_CONNECTED = 2;
  // A credential is present but the service rejected it or could not be reached.
  CONNECTION_STATE_ERROR = 3;
}

enum ConnectionBilling {
  CONNECTION_BILLING_UNKNOWN = 0;
  CONNECTION_BILLING_SUBSCRIPTION = 1;
  CONNECTION_BILLING_METERED = 2;
}

message JevConnection {
  ConnectionState state = 1;
  string detail = 2;
  string model = 3;
  bool key_stored = 4;
  // False where there is no secure credential store yet (non-Windows).
  bool can_store_key = 5;
  // What JEV receives, e.g. "Counts and categories only".
  string sends = 6;
}

message AgentConnection {
  ConnectionState state = 1;
  string detail = 2;
  string version = 3;
  ConnectionBilling billing = 4;
  bool investigations_enabled = 5;
  string investigations_detail = 6;
}

// The switches the Connections panel edits (TDD §40). Everything else stays in settings.json.
message ConnectionSettings {
  // privacy.allowCloudReasoning: the master switch for every outbound model call.
  bool allow_cloud_reasoning = 1;
  // jev.enabled
  bool jev_enabled = 2;
  // privacy.allowCodeSnippetsToJev: convention wording, not just counts and categories.
  bool allow_code_snippets_to_jev = 3;
  // agents.enabled and privacy.allowCodeToAgents together: investigations send repository code to the agent.
  bool investigations_enabled = 4;

  // Cloud AI limits. Unset on an update leaves the saved value alone.
  optional string jev_model = 5;
  optional double jev_timeout_seconds = 6;
  optional bool jev_require_zero_data_retention = 7;
  optional int32 max_investigations_per_pull_request = 8;
  optional int32 max_concurrent_investigations = 9;
  // Never switch an investigation from subscription to metered billing without this opt-in (TDD §37.5).
  optional bool allow_metered_usage = 10;
}

message Connections {
  JevConnection jev = 1;
  AgentConnection claude = 2;
  // Where the non-secret preferences live (jev.enabled, privacy.*, agents.*).
  string settings_path = 3;
  ConnectionSettings settings = 4;
}

// How picky convention detection is. The detector's looser pre-filter is derived from minimum_support.
message ReviewSensitivity {
  int32 minimum_peers = 1;
  // 0..1
  double minimum_support = 2;
  double minimum_lift = 3;
  int32 max_points_per_type = 4;
  int32 max_examples = 5;
}

message ReviewRules {
  // Unset on a repository while it inherits the global sensitivity.
  ReviewSensitivity sensitivity = 1;
  // Type or member names never treated as a convention.
  repeated string ignored_names = 2;
  // Gitignore-style path patterns treated as mechanical.
  repeated string mechanical_paths = 3;
  // Path patterns whose changes are never flagged.
  repeated string skipped_paths = 4;
}

// Owner and name empty: the global settings only.
message ReviewSettingsRequest {
  string owner = 1;
  string name = 2;
}

message ReviewSettingsReply {
  ReviewRules global = 1;
  // Present when a repository was asked for; its lists add to the global ones.
  ReviewRules repository = 2;
  repeated string built_in_ignored_names = 3;
  repeated string built_in_mechanical_paths = 4;
  string settings_path = 5;
  string repository_settings_path = 6;
  // The presets' numbers, so the app can show which one the current values match.
  ReviewSensitivity quiet = 7;
  ReviewSensitivity balanced = 8;
  ReviewSensitivity thorough = 9;
}

// Owner and name empty: replaces the global settings. Otherwise replaces that repository's overrides.
message UpdateReviewSettingsRequest {
  string owner = 1;
  string name = 2;
  ReviewRules rules = 3;
}
