syntax = "proto3";

package lumen.v1;

option csharp_namespace = "Lumen.Contracts";

import "google/protobuf/timestamp.proto";

// The desktop client <-> local review engine boundary (TDD §47–48).
service ReviewEngine {
  rpc Ping (PingRequest) returns (PingReply);

  // Opens (or re-attaches to) a pull request and streams its analysis. Late subscribers receive a replay.
  rpc WatchPullRequest (WatchPullRequestRequest) returns (stream PullRequestEvent);

  rpc GetFileDiff (GetFileDiffRequest) returns (FileDiff);

  // A file at the PR head, e.g. to open a precedent example in full.
  rpc GetSourceFile (GetSourceFileRequest) returns (SourceFile);

  rpc SetReviewPointState (SetReviewPointStateRequest) returns (SetReviewPointStateReply);

  rpc PostReviewComment (PostReviewCommentRequest) returns (PostReviewCommentReply);

  // Ticks or clears GitHub's per-file "Viewed" checkbox for the signed-in user.
  rpc SetFileViewed (SetFileViewedRequest) returns (SetFileViewedReply);

  // Connections (TDD §39). Checking status spends no usage. Keys go to the platform credential store and are never
  // returned or logged.
  rpc GetConnections (GetConnectionsRequest) returns (Connections);

  rpc SetOpenRouterKey (SetOpenRouterKeyRequest) returns (Connections);

  rpc RemoveOpenRouterKey (RemoveOpenRouterKeyRequest) returns (Connections);

  // Saved to settings.json and applied to the next JEV call or investigation, without a restart.
  rpc UpdateConnectionSettings (ConnectionSettings) returns (Connections);

  // Review settings: global defaults in settings.json, each repository's overrides beside it. They apply to the next
  // analysis of a pull request; nothing re-runs on its own (the app offers Re-analyse).
  rpc GetReviewSettings (ReviewSettingsRequest) returns (ReviewSettingsReply);

  rpc UpdateReviewSettings (UpdateReviewSettingsRequest) returns (ReviewSettingsReply);

  // ---- v2: inbox (M1) ----

  // One round trip to GitHub (unless a recent result is cached and refresh is false).
  rpc ListInbox (ListInboxRequest) returns (Inbox);

  // The inbox now, then again whenever it is refreshed (polled every 2 minutes while someone is watching).
  rpc WatchInbox (WatchInboxRequest) returns (stream Inbox);

  rpc GetInboxSettings (GetInboxSettingsRequest) returns (InboxSettings);

  rpc UpdateInboxSettings (InboxSettings) returns (InboxSettings);

  // ---- v2: pull request context (M2) ----

  rpc GetPullRequestDetails (GetPullRequestDetailsRequest) returns (PullRequestDetails);

  // The files changed between two commits of the pull request (a commit, a range, or "since last review").
  rpc GetDiffRange (GetDiffRangeRequest) returns (DiffRange);

  // A top-level comment on the pull request's conversation. Posted at once (an explicit action).
  rpc PostIssueComment (PostIssueCommentRequest) returns (TimelineItem);

  // ---- v2: threads (M4) ----

  rpc ReplyToThread (ReplyToThreadRequest) returns (ReviewThread);

  rpc SetThreadResolved (SetThreadResolvedRequest) returns (ReviewThread);

  // ---- v2: pending review (M5) ----

  // The viewer's pending review on GitHub, if any (one started on github.com is picked up too).
  rpc GetPendingReview (GetPendingReviewRequest) returns (PendingReview);

  // Starts the pending review if there is none.
  rpc AddPendingComment (AddPendingCommentRequest) returns (PendingReview);

  rpc UpdatePendingComment (UpdatePendingCommentRequest) returns (PendingReview);

  rpc DeletePendingComment (DeletePendingCommentRequest) returns (PendingReview);

  rpc SubmitReview (SubmitReviewRequest) returns (SubmitReviewReply);

  // ---- v2: fast model and walkthrough (M7, M8) ----

  // Stored in the platform credential store, never returned or logged.
  rpc SetCloudflareCredentials (SetCloudflareCredentialsRequest) returns (Connections);

  rpc RemoveCloudflareCredentials (RemoveCloudflareCredentialsRequest) returns (Connections);

  // Runs (or re-sends from cache) the walkthrough; results arrive as WalkthroughUpdated on the pull request's stream.
  rpc StartWalkthrough (StartWalkthroughRequest) returns (StartWalkthroughReply);
}

message PingRequest {}

message PingReply {
  string version = 1;
  int32 process_id = 2;
}

message PullRequestRef {
  string owner = 1;
  string name = 2;
  int32 number = 3;
}

message WatchPullRequestRequest {
  PullRequestRef pull_request = 1;
  // Re-fetch from GitHub even if an analysis for this PR is already running or complete.
  bool refresh = 2;
}

message PullRequestEvent {
  oneof event {
    AnalysisProgress progress = 1;
    PullRequestSnapshot snapshot = 2;
    ReviewPoint review_point_added = 3;
    ReviewPointStateChanged review_point_state_changed = 4;
    ConventionsFound conventions = 5;
    AnalysisComplete complete = 6;
    AnalysisFailed failed = 7;
    // A review point already sent, replaced in full (e.g. after an investigation added evidence).
    ReviewPoint review_point_updated = 8;
    InvestigationStatus investigation_status = 9;
    FileViewed file_viewed = 10;
    // v2
    TimelineUpdated timeline_updated = 11;
    ChecksUpdated checks_updated = 12;
    HeadChanged head_changed = 13;
    ThreadsUpdated threads_updated = 14;
    WalkthroughUpdated walkthrough_updated = 15;
    PendingReview pending_review_updated = 16;
  }
}

// A file's "Viewed" checkbox changed after the snapshot was sent.
message FileViewed {
  string path = 1;
  bool viewed = 2;
}

// Background investigations; may continue after AnalysisComplete (TDD §49: at most "Analysing N areas…").
message InvestigationStatus {
  int32 active = 1;
  // Why investigations are not running, when they were wanted but could not start (e.g. "Not signed in").
  string detail = 2;
}

message AnalysisProgress {
  string stage = 1;
  string message = 2;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_MODIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_DELETED = 2;
  FILE_CHANGE_KIND_RENAMED = 3;
}

message ChangedFileSummary {
  string path = 1;
  string old_path = 2;
  FileChangeKind kind = 3;
  int32 additions = 4;
  int32 deletions = 5;
  bool is_binary = 6;
  bool is_mechanical = 7;
  string mechanical_reason = 8;
  // The viewer ticked "Viewed" on GitHub and the file has not changed since.
  bool is_viewed = 9;
  // Renamed files: git's similarity index, 0-100 (100 when only the path changed).
  int32 similarity = 10;
}

message PullRequestSnapshot {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  string state = 4;
  bool is_draft = 5;
  string base_ref = 6;
  string head_ref = 7;
  string url = 8;
  string body = 9;
  string base_sha = 10;
  string head_sha = 11;
  string merge_base_sha = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated ChangedFileSummary files = 14;
  string viewer_login = 15;
  int32 review_thread_count = 16;
}

message GetFileDiffRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  // Optional: limit the diff to from_sha..to_sha (a commit, a range, or "since last review"). Empty: the whole PR.
  CommitRange range = 3;
  // git diff -w
  bool ignore_whitespace = 4;
}

message CommitRange {
  // The commit before the range (exclusive).
  string from_sha = 1;
  string to_sha = 2;
}

enum DiffLineKind {
  DIFF_LINE_KIND_CONTEXT = 0;
  DIFF_LINE_KIND_ADDED = 1;
  DIFF_LINE_KIND_REMOVED = 2;
}

message DiffLine {
  DiffLineKind kind = 1;
  // 0 when the line does not exist on that side.
  int32 old_number = 2;
  int32 new_number = 3;
  string text = 4;
}

message DiffHunk {
  int32 old_start = 1;
  int32 old_count = 2;
  int32 new_start = 3;
  int32 new_count = 4;
  string header = 5;
  repeated DiffLine lines = 6;
}

message FileDiff {
  string path = 1;
  repeated DiffHunk hunks = 2;
}

message GetSourceFileRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
}

message SourceFile {
  string path = 1;
  string text = 2;
  bool exists = 3;
}

message CodeLocation {
  string path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  string symbol = 4;
}

enum ReviewSeverity {
  REVIEW_SEVERITY_LOW = 0;
  REVIEW_SEVERITY_MEDIUM = 1;
  REVIEW_SEVERITY_HIGH = 2;
}

enum ReviewPointState {
  REVIEW_POINT_STATE_VISIBLE = 0;
  REVIEW_POINT_STATE_EXAMINED = 1;
  REVIEW_POINT_STATE_DISMISSED = 2;
  REVIEW_POINT_STATE_COMMENTED = 3;
  REVIEW_POINT_STATE_RESOLVED = 4;
}

enum EvidenceState {
  EVIDENCE_STATE_UNVERIFIED = 0;
  EVIDENCE_STATE_VERIFIED = 1;
  EVIDENCE_STATE_STRONG = 2;
  EVIDENCE_STATE_CONFLICTING = 3;
  EVIDENCE_STATE_HUMAN_DECISION = 4;
}

message PrecedentExample {
  CodeLocation location = 1;
  string type_name = 2;
  string snippet = 3;
  int32 snippet_start_line = 4;
}

message Evidence {
  string id = 1;
  // e.g. "RepositoryPrecedent", "StaticAnalysis".
  string source = 2;
  // Provenance: the component that produced it, e.g. "peer-pattern/v1".
  string producer = 3;
  string summary = 4;
  bool is_counter_evidence = 5;
  google.protobuf.Timestamp created_at = 6;
  string convention = 7;
  int32 supporting = 8;
  int32 peer_count = 9;
  repeated PrecedentExample examples = 10;
  CodeLocation location = 11;
}

message ComparisonSide {
  string title = 1;
  string caption = 2;
  CodeLocation source = 3;
  string snippet = 4;
  int32 snippet_start_line = 5;
  repeated int32 highlight_lines = 6;
  repeated string points = 7;
}

message ComparisonSurface {
  ComparisonSide current = 1;
  ComparisonSide precedent = 2;
}

message ReviewPoint {
  string id = 1;
  // ReviewPointType name, e.g. "PatternDeviation".
  string type = 2;
  ReviewSeverity severity = 3;
  ReviewPointState state = 4;
  EvidenceState evidence_state = 5;
  string title = 6;
  string summary = 7;
  string why_it_matters = 8;
  string suggested_comment = 9;
  CodeLocation anchor = 10;
  repeated CodeLocation other_locations = 11;
  repeated Evidence evidence = 12;
  ComparisonSurface comparison = 13;
  double priority = 14;
  string routing_reason = 15;
}

message ReviewPointStateChanged {
  string review_point_id = 1;
  ReviewPointState state = 2;
}

message Convention {
  string id = 1;
  string statement = 2;
  string peer_group = 3;
  int32 supporting = 4;
  int32 peer_count = 5;
  repeated CodeLocation examples = 6;
}

message ConventionsFound {
  repeated Convention conventions = 1;
}

message AnalysisComplete {
  int32 review_point_count = 1;
  int32 suppressed_count = 2;
  int64 duration_ms = 3;
}

message AnalysisFailed {
  string message = 1;
  bool is_authentication = 2;
}

message SetReviewPointStateRequest {
  PullRequestRef pull_request = 1;
  string review_point_id = 2;
  ReviewPointState state = 3;
}

message SetReviewPointStateReply {}

enum DiffSide {
  // The head side (added and unchanged lines).
  DIFF_SIDE_RIGHT = 0;
  // The base side (deleted lines).
  DIFF_SIDE_LEFT = 1;
}

message PostReviewCommentRequest {
  PullRequestRef pull_request = 1;
  // Optional: the review point this comment responds to; it is marked Commented.
  string review_point_id = 2;
  string path = 3;
  // The last line of the comment's range, on `side`.
  int32 line = 4;
  string body = 5;
  DiffSide side = 6;
  // Optional (0): the first line of a multi-line range.
  int32 start_line = 7;
  DiffSide start_side = 8;
}

message PostReviewCommentReply {
  int64 comment_id = 1;
  string url = 2;
  // GitHub refuses single comments while a pending review exists, so the comment went into it instead.
  bool added_to_pending_review = 3;
  PendingReview pending_review = 4;
}

message SetFileViewedRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  bool viewed = 3;
}

message SetFileViewedReply {}

message GetConnectionsRequest {}

message SetOpenRouterKeyRequest {
  string key = 1;
}

message RemoveOpenRouterKeyRequest {}

enum ConnectionState {
  // Turned off in settings; nothing is sent.
  CONNECTION_STATE_OFF = 0;
  // Allowed, but no credential or sign-in yet.
  CONNECTION_STATE_NOT_CONNECTED = 1;
  CONNECTION_STATE_CONNECTED = 2;
  // A credential is present but the service rejected it or could not be reached.
  CONNECTION_STATE_ERROR = 3;
}

enum ConnectionBilling {
  CONNECTION_BILLING_UNKNOWN = 0;
  CONNECTION_BILLING_SUBSCRIPTION = 1;
  CONNECTION_BILLING_METERED = 2;
}

message JevConnection {
  ConnectionState state = 1;
  string detail = 2;
  string model = 3;
  bool key_stored = 4;
  // False where there is no secure credential store yet (non-Windows).
  bool can_store_key = 5;
  // What JEV receives, e.g. "Counts and categories only".
  string sends = 6;
}

message AgentConnection {
  ConnectionState state = 1;
  string detail = 2;
  string version = 3;
  ConnectionBilling billing = 4;
  bool investigations_enabled = 5;
  string investigations_detail = 6;
}

// The switches the Connections panel edits (TDD §40). Everything else stays in settings.json.
message ConnectionSettings {
  // privacy.allowCloudReasoning: the master switch for every outbound model call.
  bool allow_cloud_reasoning = 1;
  // jev.enabled
  bool jev_enabled = 2;
  // privacy.allowCodeSnippetsToJev: convention wording, not just counts and categories.
  bool allow_code_snippets_to_jev = 3;
  // agents.enabled and privacy.allowCodeToAgents together: investigations send repository code to the agent.
  bool investigations_enabled = 4;

  // Cloud AI limits. Unset on an update leaves the saved value alone.
  optional string jev_model = 5;
  optional double jev_timeout_seconds = 6;
  optional bool jev_require_zero_data_retention = 7;
  optional int32 max_investigations_per_pull_request = 8;
  optional int32 max_concurrent_investigations = 9;
  // Never switch an investigation from subscription to metered billing without this opt-in (TDD §37.5).
  optional bool allow_metered_usage = 10;

  // privacy.allowCodeToFastModel: the diff goes to the fast model (Cloudflare Workers AI). Unset leaves it alone.
  optional bool allow_code_to_fast_model = 11;
  optional string fast_model_id = 12;
  optional double fast_model_timeout_seconds = 13;
  // Largest diff sent, in KB; bigger files are truncated and the rest summarised by path and size.
  optional int32 fast_model_max_diff_kb = 14;
  optional int32 fast_model_daily_request_cap = 15;
  // Optional Cloudflare AI Gateway id: requests go through the gateway (caching, logs) instead of Workers AI directly.
  optional string fast_model_gateway = 16;
}

message Connections {
  JevConnection jev = 1;
  AgentConnection claude = 2;
  // Where the non-secret preferences live (jev.enabled, privacy.*, agents.*).
  string settings_path = 3;
  ConnectionSettings settings = 4;
  FastModelConnection fast_model = 5;
}

// How picky convention detection is. The detector's looser pre-filter is derived from minimum_support.
message ReviewSensitivity {
  int32 minimum_peers = 1;
  // 0..1
  double minimum_support = 2;
  double minimum_lift = 3;
  int32 max_points_per_type = 4;
  int32 max_examples = 5;
}

message ReviewRules {
  // Unset on a repository while it inherits the global sensitivity.
  ReviewSensitivity sensitivity = 1;
  // Type or member names never treated as a convention.
  repeated string ignored_names = 2;
  // Gitignore-style path patterns treated as mechanical.
  repeated string mechanical_paths = 3;
  // Path patterns whose changes are never flagged.
  repeated string skipped_paths = 4;
}

// Owner and name empty: the global settings only.
message ReviewSettingsRequest {
  string owner = 1;
  string name = 2;
}

message ReviewSettingsReply {
  ReviewRules global = 1;
  // Present when a repository was asked for; its lists add to the global ones.
  ReviewRules repository = 2;
  repeated string built_in_ignored_names = 3;
  repeated string built_in_mechanical_paths = 4;
  string settings_path = 5;
  string repository_settings_path = 6;
  // The presets' numbers, so the app can show which one the current values match.
  ReviewSensitivity quiet = 7;
  ReviewSensitivity balanced = 8;
  ReviewSensitivity thorough = 9;
}

// Owner and name empty: replaces the global settings. Otherwise replaces that repository's overrides.
message UpdateReviewSettingsRequest {
  string owner = 1;
  string name = 2;
  ReviewRules rules = 3;
}

// ===================================== v2 =====================================

// ---- Inbox (M1) ----

message ListInboxRequest {
  // Ask GitHub now rather than returning a result from the last poll.
  bool refresh = 1;
}

message WatchInboxRequest {}

enum InboxCheckState {
  INBOX_CHECK_STATE_NONE = 0;
  INBOX_CHECK_STATE_PENDING = 1;
  INBOX_CHECK_STATE_SUCCESS = 2;
  INBOX_CHECK_STATE_FAILURE = 3;
}

enum InboxReviewState {
  INBOX_REVIEW_STATE_AWAITING = 0;
  INBOX_REVIEW_STATE_APPROVED = 1;
  INBOX_REVIEW_STATE_CHANGES_REQUESTED = 2;
  // No review required (e.g. no branch protection) and none given.
  INBOX_REVIEW_STATE_NONE = 3;
}

message InboxItem {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 additions = 6;
  int32 deletions = 7;
  int32 changed_files = 8;
  bool is_draft = 9;
  InboxCheckState checks = 10;
  InboxReviewState review = 11;
  // Activity since the viewer last opened it in Lumen (or never opened).
  bool unread = 12;
  string url = 13;
  string head_sha = 14;
  // Never opened in Lumen.
  bool is_new = 15;
}

message InboxSection {
  // "review-requested", "mine", "watched".
  string id = 1;
  string title = 2;
  repeated InboxItem items = 3;
  // Why the section is empty, e.g. "Add repositories to watch in Settings".
  string detail = 4;
}

message Inbox {
  repeated InboxSection sections = 1;
  string viewer_login = 2;
  google.protobuf.Timestamp fetched_at = 3;
  // Set when GitHub could not be reached; sections then hold the last good result, if any.
  string error = 4;
  bool is_authentication_error = 5;
}

message GetInboxSettingsRequest {}

message InboxSettings {
  // "owner/name"
  repeated string watched_repositories = 1;
}

// ---- Pull request context (M2) ----

message GetPullRequestDetailsRequest {
  PullRequestRef pull_request = 1;
  // Ask GitHub now rather than returning what the session already has.
  bool refresh = 2;
}

message Label {
  string name = 1;
  // "rrggbb"
  string color = 2;
}

enum ReviewVerdict {
  REVIEW_VERDICT_COMMENTED = 0;
  REVIEW_VERDICT_APPROVED = 1;
  REVIEW_VERDICT_CHANGES_REQUESTED = 2;
  REVIEW_VERDICT_DISMISSED = 3;
  REVIEW_VERDICT_PENDING = 4;
}

message Reviewer {
  string login = 1;
  // A team review request ("org/team").
  bool is_team = 2;
  // Requested and not yet reviewed.
  bool is_requested = 3;
  ReviewVerdict verdict = 4;
  bool has_verdict = 5;
}

enum TimelineItemKind {
  TIMELINE_ITEM_KIND_COMMENT = 0;
  TIMELINE_ITEM_KIND_REVIEW = 1;
}

message TimelineItem {
  string id = 1;
  TimelineItemKind kind = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  string url = 6;
  // Reviews only.
  ReviewVerdict verdict = 7;
  int32 review_comment_count = 8;
}

message CommitInfo {
  string sha = 1;
  string headline = 2;
  string message = 3;
  string author = 4;
  google.protobuf.Timestamp authored_at = 5;
}

enum CheckState {
  CHECK_STATE_PENDING = 0;
  CHECK_STATE_SUCCESS = 1;
  CHECK_STATE_FAILURE = 2;
  CHECK_STATE_NEUTRAL = 3;
  CHECK_STATE_SKIPPED = 4;
  CHECK_STATE_CANCELLED = 5;
}

message CheckRun {
  string name = 1;
  CheckState state = 2;
  // Raw GitHub status/conclusion, e.g. "IN_PROGRESS", "TIMED_OUT".
  string detail = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  string url = 6;
  // A commit status (rather than a check run).
  bool is_status = 7;
}

enum Mergeability {
  MERGEABILITY_UNKNOWN = 0;
  MERGEABILITY_MERGEABLE = 1;
  MERGEABILITY_CONFLICTING = 2;
}

message PullRequestDetails {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  string state = 5;
  bool is_draft = 6;
  string base_ref = 7;
  string head_ref = 8;
  string head_sha = 9;
  Mergeability mergeability = 10;
  // GitHub's mergeStateStatus, e.g. "BLOCKED", "CLEAN", "BEHIND".
  string merge_state = 11;
  repeated Label labels = 12;
  repeated Reviewer reviewers = 13;
  repeated TimelineItem timeline = 14;
  repeated CommitInfo commits = 15;
  repeated CheckRun checks = 16;
  string viewer_login = 17;
  // The head at the viewer's last submitted review (GitHub, or a review submitted from Lumen), else at last open.
  string last_reviewed_sha = 18;
  // True when last_reviewed_sha came from opening the pull request, not from a review.
  bool last_reviewed_is_open = 19;
  string url = 20;
  google.protobuf.Timestamp created_at = 21;
}

message TimelineUpdated {
  repeated TimelineItem timeline = 1;
}

message ChecksUpdated {
  repeated CheckRun checks = 1;
  string head_sha = 2;
}

// New commits were pushed while the pull request was open. The app offers to reload.
message HeadChanged {
  string old_sha = 1;
  string new_sha = 2;
}

message GetDiffRangeRequest {
  PullRequestRef pull_request = 1;
  CommitRange range = 2;
  bool ignore_whitespace = 3;
}

message DiffRange {
  CommitRange range = 1;
  repeated ChangedFileSummary files = 2;
  // The old commit is not an ancestor of the new one (history was rewritten): file contents are compared directly.
  bool is_force_push = 3;
  // Shown to the reviewer, e.g. "History was rewritten since your last review; comparing file contents."
  string note = 4;
}

message PostIssueCommentRequest {
  PullRequestRef pull_request = 1;
  string body = 2;
}

// ---- Threads (M4) ----

message ThreadComment {
  string id = 1;
  int64 database_id = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  string url = 6;
  // Part of the viewer's pending review (not yet visible to others).
  bool is_pending = 7;
}

message ReviewThread {
  string id = 1;
  string path = 2;
  DiffSide side = 3;
  // Current position at the head; 0 when the thread is outdated (its line no longer exists).
  int32 line = 4;
  int32 start_line = 5;
  // Position in the commit it was written against.
  int32 original_line = 6;
  int32 original_start_line = 7;
  string original_commit_sha = 8;
  bool is_resolved = 9;
  bool is_outdated = 10;
  repeated ThreadComment comments = 11;
  bool can_reply = 12;
  bool can_resolve = 13;
  bool can_unresolve = 14;
  // The diff hunk the first comment was written on, for outdated threads.
  string diff_hunk = 15;
}

message ThreadsUpdated {
  repeated ReviewThread threads = 1;
}

message ReplyToThreadRequest {
  PullRequestRef pull_request = 1;
  string thread_id = 2;
  string body = 3;
}

message SetThreadResolvedRequest {
  PullRequestRef pull_request = 1;
  string thread_id = 2;
  bool resolved = 3;
}

// ---- Pending review (M5) ----

message GetPendingReviewRequest {
  PullRequestRef pull_request = 1;
}

message PendingComment {
  string id = 1;
  string thread_id = 2;
  string path = 3;
  DiffSide side = 4;
  int32 line = 5;
  int32 start_line = 6;
  string body = 7;
  // A reply to an existing thread rather than a new one.
  bool is_reply = 8;
  // The review point it was written for, when Lumen knows.
  string review_point_id = 9;
}

message PendingReview {
  // Empty when there is no pending review.
  string id = 1;
  string body = 2;
  repeated PendingComment comments = 3;
}

message AddPendingCommentRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  DiffSide side = 3;
  int32 line = 4;
  int32 start_line = 5;
  DiffSide start_side = 6;
  string body = 7;
  string review_point_id = 8;
  // Set to reply to an existing thread inside the pending review instead of starting a new one.
  string reply_to_thread_id = 9;
}

message UpdatePendingCommentRequest {
  PullRequestRef pull_request = 1;
  string comment_id = 2;
  string body = 3;
}

message DeletePendingCommentRequest {
  PullRequestRef pull_request = 1;
  string comment_id = 2;
}

enum ReviewEvent {
  REVIEW_EVENT_COMMENT = 0;
  REVIEW_EVENT_APPROVE = 1;
  REVIEW_EVENT_REQUEST_CHANGES = 2;
}

message SubmitReviewRequest {
  PullRequestRef pull_request = 1;
  ReviewEvent event = 2;
  string body = 3;
}

message SubmitReviewReply {
  string url = 1;
  // The head the review was submitted at (feeds "since last review").
  string head_sha = 2;
}

// ---- Fast model (M7) ----

message SetCloudflareCredentialsRequest {
  string account_id = 1;
  string api_token = 2;
}

message RemoveCloudflareCredentialsRequest {}

message FastModelConnection {
  ConnectionState state = 1;
  string detail = 2;
  string model = 3;
  bool credentials_stored = 4;
  bool can_store_credentials = 5;
  // What is sent, e.g. "The pull request's diff, title and description".
  string sends = 6;
  int32 requests_today = 7;
}

// ---- Walkthrough (M8) ----

message StartWalkthroughRequest {
  PullRequestRef pull_request = 1;
  // Optional: a short "what changed since you last looked" walkthrough of this range instead of the whole PR.
  CommitRange since = 2;
  // Ignore the cache.
  bool refresh = 3;
}

message StartWalkthroughReply {}

enum WalkthroughStatus {
  // Not offered: the fast model is off, not connected, or not allowed to see code.
  WALKTHROUGH_STATUS_UNAVAILABLE = 0;
  WALKTHROUGH_STATUS_RUNNING = 1;
  WALKTHROUGH_STATUS_COMPLETE = 2;
  WALKTHROUGH_STATUS_FAILED = 3;
}

message WalkthroughGroup {
  string id = 1;
  string title = 2;
  string summary = 3;
  repeated string paths = 4;
  // 1-based reading order.
  int32 order = 5;
  bool is_mechanical = 6;
}

enum RiskCategory {
  RISK_CATEGORY_OTHER = 0;
  RISK_CATEGORY_CONCURRENCY = 1;
  RISK_CATEGORY_ERROR_HANDLING = 2;
  RISK_CATEGORY_SECURITY = 3;
  RISK_CATEGORY_BEHAVIOUR_CHANGE = 4;
  RISK_CATEGORY_MISSING_TESTS = 5;
}

message WalkthroughRisk {
  string id = 1;
  CodeLocation location = 2;
  RiskCategory category = 3;
  string reason = 4;
}

// The Map (plan v3): what part of the system a component plays.
enum ComponentLayer {
  COMPONENT_LAYER_OTHER = 0;
  COMPONENT_LAYER_ENTRY = 1;
  COMPONENT_LAYER_UI = 2;
  COMPONENT_LAYER_CORE = 3;
  COMPONENT_LAYER_INTEGRATION = 4;
  COMPONENT_LAYER_DATA = 5;
  COMPONENT_LAYER_CONFIG = 6;
}

// How one changed file uses another, strongest last.
enum LinkKind {
  LINK_KIND_REFERENCES = 0;
  LINK_KIND_DEPENDS_ON = 1;
  LINK_KIND_IMPLEMENTS = 2;
  LINK_KIND_TESTS = 3;
}

// A part of the system the pull request builds or changes, and its (hand-written, non-test) files.
message WalkthroughComponent {
  string id = 1;
  string title = 2;
  string role = 3;
  ComponentLayer layer = 4;
  repeated string paths = 5;
}

// "from" uses "to" (component ids). Found in the code unless inferred (only the model suggested it).
message WalkthroughEdge {
  string from = 1;
  string to = 2;
  LinkKind kind = 3;
  bool inferred = 4;
  string label = 5;
}

// A link between two changed files found in the code: "from" uses "to".
message FileLink {
  string from = 1;
  string to = 2;
  LinkKind kind = 3;
}

message Walkthrough {
  WalkthroughStatus status = 1;
  // Progress or why it is unavailable / failed.
  string detail = 2;
  string intent = 3;
  // Where the description and the diff disagree; empty if they agree.
  string description_mismatch = 4;
  repeated WalkthroughGroup groups = 5;
  repeated WalkthroughRisk risks = 6;
  // e.g. "glm-5.3-flash · walkthrough/v2"
  string producer = 7;
  string head_sha = 8;
  // Set for a "since last review" walkthrough.
  CommitRange since = 9;
  bool from_cache = 10;
  // Files summarised so far / total (while running).
  int32 files_done = 11;
  int32 files_total = 12;
  // The Map (plan v3): components, how they connect, and the file links found in the code.
  repeated WalkthroughComponent components = 13;
  repeated WalkthroughEdge edges = 14;
  repeated FileLink file_links = 15;
}

message WalkthroughUpdated {
  Walkthrough walkthrough = 1;
}
