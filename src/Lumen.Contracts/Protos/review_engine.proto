syntax = "proto3";

package lumen.v1;

option csharp_namespace = "Lumen.Contracts";

import "google/protobuf/timestamp.proto";

// The desktop client <-> local review engine boundary (TDD §47–48).
service ReviewEngine {
  rpc Ping (PingRequest) returns (PingReply);

  // Opens (or re-attaches to) a pull request and streams its analysis. Late subscribers receive a replay.
  rpc WatchPullRequest (WatchPullRequestRequest) returns (stream PullRequestEvent);

  rpc GetFileDiff (GetFileDiffRequest) returns (FileDiff);

  // A file at the PR head, e.g. to open a precedent example in full.
  rpc GetSourceFile (GetSourceFileRequest) returns (SourceFile);


  rpc PostReviewComment (PostReviewCommentRequest) returns (PostReviewCommentReply);

  // Ticks or clears GitHub's per-file "Viewed" checkbox for the signed-in user.
  rpc SetFileViewed (SetFileViewedRequest) returns (SetFileViewedReply);






  // Review settings: global defaults in settings.json, each repository's overrides beside it. They apply to the next
  // analysis of a pull request; nothing re-runs on its own (the app offers Re-analyse).
  rpc GetReviewSettings (ReviewSettingsRequest) returns (ReviewSettingsReply);

  rpc UpdateReviewSettings (UpdateReviewSettingsRequest) returns (ReviewSettingsReply);

  // ---- v2: inbox (M1) ----

  // One round trip to GitHub (unless a recent result is cached and refresh is false).
  rpc ListInbox (ListInboxRequest) returns (Inbox);

  // The inbox now, then again whenever it is refreshed (polled every 2 minutes while someone is watching).
  rpc WatchInbox (WatchInboxRequest) returns (stream Inbox);

  rpc GetInboxSettings (GetInboxSettingsRequest) returns (InboxSettings);

  rpc UpdateInboxSettings (InboxSettings) returns (InboxSettings);

  // ---- v2: pull request context (M2) ----

  rpc GetPullRequestDetails (GetPullRequestDetailsRequest) returns (PullRequestDetails);

  // The files changed between two commits of the pull request (a commit, a range, or "since last review").
  rpc GetDiffRange (GetDiffRangeRequest) returns (DiffRange);

  // A top-level comment on the pull request's conversation. Posted at once (an explicit action).
  rpc PostIssueComment (PostIssueCommentRequest) returns (TimelineItem);

  // ---- v2: threads (M4) ----

  rpc ReplyToThread (ReplyToThreadRequest) returns (ReviewThread);

  rpc SetThreadResolved (SetThreadResolvedRequest) returns (ReviewThread);

  // ---- v2: pending review (M5) ----

  // The viewer's pending review on GitHub, if any (one started on github.com is picked up too).
  rpc GetPendingReview (GetPendingReviewRequest) returns (PendingReview);

  // Starts the pending review if there is none.
  rpc AddPendingComment (AddPendingCommentRequest) returns (PendingReview);

  rpc UpdatePendingComment (UpdatePendingCommentRequest) returns (PendingReview);

  rpc DeletePendingComment (DeletePendingCommentRequest) returns (PendingReview);

  rpc SubmitReview (SubmitReviewRequest) returns (SubmitReviewReply);

  // ---- overhaul: local branches and tracking ----

  // Local targets opened before, newest first (the inbox's Local branches section).
  rpc ListLocalBranches (ListLocalBranchesRequest) returns (LocalBranches);

  // Marks (or clears) units as reviewed at their current fingerprint. On a pull request, files whose every slice is
  // now reviewed get GitHub's Viewed box ticked.
  rpc SetMarked (SetMarkedRequest) returns (MarksUpdated);

  // "Since my last look": each file's patch against its own merge-base, old head vs the current one.
  rpc GetSinceLastLook (GetSinceLastLookRequest) returns (SinceLastLook);

  // ---- v2: fast model and walkthrough (M7, M8) ----



}

message PingRequest {}

message PingReply {
  string version = 1;
  int32 process_id = 2;
}

message PullRequestRef {
  string owner = 1;
  string name = 2;
  int32 number = 3;
}

message WatchPullRequestRequest {
  PullRequestRef pull_request = 1;
  // Re-fetch from GitHub even if an analysis for this PR is already running or complete.
  bool refresh = 2;
  // Set instead of pull_request to review a local clone. The snapshot's pull_request then carries the session's
  // synthetic ref (owner "local"), which every other request uses.
  LocalBranchRef local = 3;
}

// A local clone reviewed read-only: base_ref against a branch, or against the working tree (uncommitted included).
message LocalBranchRef {
  string clone_path = 1;
  string base_ref = 2;
  bool working_tree = 3;
  // The branch when working_tree is false.
  string head_ref = 4;
}

message PullRequestEvent {
  oneof event {
    AnalysisProgress progress = 1;
    PullRequestSnapshot snapshot = 2;
    AnalysisComplete complete = 6;
    AnalysisFailed failed = 7;
    FileViewed file_viewed = 10;
    // v2
    TimelineUpdated timeline_updated = 11;
    ChecksUpdated checks_updated = 12;
    HeadChanged head_changed = 13;
    ThreadsUpdated threads_updated = 14;
    PendingReview pending_review_updated = 16;
    // What folds, per hunk. Sent once per analysis, after the snapshot.
    TriageReady triage_ready = 17;
    // Feature slices: sent after triage, or never when slicing falls back to the file list.
    SlicesReady slices_ready = 19;
    // Red flags, each anchored to a line. Sent after slices (or after triage when slicing fell back).
    FlagsReady flags_ready = 20;
    // Reviewed marks changed (sent once with the stored marks, then after every SetMarked).
    MarksUpdated marks_updated = 21;
  }
  reserved 3, 4, 5, 8, 9, 15, 18;
}

// A file's "Viewed" checkbox changed after the snapshot was sent.
message FileViewed {
  string path = 1;
  bool viewed = 2;
}

message AnalysisProgress {
  string stage = 1;
  string message = 2;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_MODIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_DELETED = 2;
  FILE_CHANGE_KIND_RENAMED = 3;
}

message ChangedFileSummary {
  string path = 1;
  string old_path = 2;
  FileChangeKind kind = 3;
  int32 additions = 4;
  int32 deletions = 5;
  bool is_binary = 6;
  bool is_mechanical = 7;
  string mechanical_reason = 8;
  // The viewer ticked "Viewed" on GitHub and the file has not changed since.
  bool is_viewed = 9;
  // Renamed files: git's similarity index, 0-100 (100 when only the path changed).
  int32 similarity = 10;
  reserved 11;
  // Changed lines per fold. Empty in the snapshot; filled in the files TriageReady re-sends.
  FoldLines fold_lines = 12;
}

// Changed lines (added plus removed) by whether they fold.
message FoldLines {
  // Left open: what there is to read.
  int32 open = 1;
  int32 mechanical = 2;
  int32 boilerplate = 3;
}

// Whether a hunk is folded behind a one-line reason. The zero value is the safe one: unset means open.
enum FoldKind {
  FOLD_KIND_OPEN = 0;
  // "Mechanical · Proven".
  FOLD_KIND_MECHANICAL = 1;
  // "Boilerplate · Not verified".
  FOLD_KIND_BOILERPLATE = 2;
}

// What kind of change a hunk is. The zero value is the conservative one: an unset class is never mechanical.
enum ChangeClass {
  CHANGE_CLASS_BEHAVIOUR_CHANGE = 0;
  CHANGE_CLASS_NEW_CODE = 1;
  CHANGE_CLASS_FORMATTING = 2;
  CHANGE_CLASS_COMMENTS_ONLY = 3;
  CHANGE_CLASS_IMPORTS_ONLY = 4;
  CHANGE_CLASS_RENAME = 5;
  CHANGE_CLASS_MOVE = 6;
  CHANGE_CLASS_RIPPLE = 7;
  CHANGE_CLASS_GENERATED = 8;
}

// One hunk (or part of one). Lines are 1-based and inclusive; 0 when the side has no lines.
message HunkTriage {
  string path = 1;
  int32 old_start = 2;
  int32 old_end = 3;
  int32 new_start = 4;
  int32 new_end = 5;
  ChangeClass change_class = 6;
  reserved 7;
  FoldKind fold = 11;
  // In words, e.g. "pure rename `Foo`→`Bar`". Never a score.
  repeated string reasons = 8;
  int32 changed_lines = 9;
  // Empty when the hunk is in no group.
  string group_id = 10;
}

// Hunks that are one idea across the pull request; members are the hunks carrying this group_id.
message TriageGroup {
  string id = 1;
  ChangeClass change_class = 2;
  string title = 3;
  int32 member_count = 4;
  int32 changed_lines = 5;
  reserved 6;
}

message TriageSummary {
  int32 total_lines = 2;
  // Folded as Mechanical · Proven.
  int32 mechanical_lines = 3;
  int32 new_code_lines = 4;
  int32 behaviour_change_lines = 5;
  // A mechanical class left open, e.g. ripple call sites or a move into another type.
  int32 likely_mechanical_lines = 7;
  // Folded as Boilerplate · Not verified.
  int32 boilerplate_lines = 8;
  // Left open by default: what there is to read.
  int32 open_lines = 9;
  reserved 1, 6;
}

message TriageReady {
  repeated HunkTriage hunks = 1;
  repeated TriageGroup groups = 2;
  TriageSummary summary = 3;
  // The snapshot's files again, with fold_lines filled; the client takes fold_lines from here by path.
  repeated ChangedFileSummary files = 4;
}

message PullRequestSnapshot {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  string state = 4;
  bool is_draft = 5;
  string base_ref = 6;
  string head_ref = 7;
  string url = 8;
  string body = 9;
  string base_sha = 10;
  string head_sha = 11;
  string merge_base_sha = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated ChangedFileSummary files = 14;
  string viewer_login = 15;
  int32 review_thread_count = 16;
  // The review target's storage key, e.g. "pr:owner/repo#12" or "local:c:/src/app|main|WorkingTree".
  string target_key = 17;
  // Set for local sessions: posting controls are hidden.
  LocalBranchRef local = 18;
}

message GetFileDiffRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  // Optional: limit the diff to from_sha..to_sha (a commit, a range, or "since last review"). Empty: the whole PR.
  CommitRange range = 3;
  // git diff -w
  bool ignore_whitespace = 4;
}

message CommitRange {
  // The commit before the range (exclusive).
  string from_sha = 1;
  string to_sha = 2;
}

enum DiffLineKind {
  DIFF_LINE_KIND_CONTEXT = 0;
  DIFF_LINE_KIND_ADDED = 1;
  DIFF_LINE_KIND_REMOVED = 2;
}

message DiffLine {
  DiffLineKind kind = 1;
  // 0 when the line does not exist on that side.
  int32 old_number = 2;
  int32 new_number = 3;
  string text = 4;
}

message DiffHunk {
  int32 old_start = 1;
  int32 old_count = 2;
  int32 new_start = 3;
  int32 new_count = 4;
  string header = 5;
  repeated DiffLine lines = 6;
}

message FileDiff {
  string path = 1;
  repeated DiffHunk hunks = 2;
}

message GetSourceFileRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  // Precedent examples are rooted at the merge-base; the full-file diff viewer uses head by default.
  bool from_base = 3;
}

message SourceFile {
  string path = 1;
  string text = 2;
  bool exists = 3;
}

message CodeLocation {
  string path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  string symbol = 4;
}

message AnalysisComplete {
  reserved 1, 2;
  int64 duration_ms = 3;
}

message AnalysisFailed {
  string message = 1;
  bool is_authentication = 2;
}

enum DiffSide {
  // The head side (added and unchanged lines).
  DIFF_SIDE_RIGHT = 0;
  // The base side (deleted lines).
  DIFF_SIDE_LEFT = 1;
}

message PostReviewCommentRequest {
  PullRequestRef pull_request = 1;
  reserved 2;
  string path = 3;
  // The last line of the comment's range, on `side`.
  int32 line = 4;
  string body = 5;
  DiffSide side = 6;
  // Optional (0): the first line of a multi-line range.
  int32 start_line = 7;
  DiffSide start_side = 8;
}

message PostReviewCommentReply {
  int64 comment_id = 1;
  string url = 2;
  // GitHub refuses single comments while a pending review exists, so the comment went into it instead.
  bool added_to_pending_review = 3;
  PendingReview pending_review = 4;
}

message SetFileViewedRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  bool viewed = 3;
}

message SetFileViewedReply {}

message ReviewRules {
  reserved 1, 2;
  // Gitignore-style path patterns treated as mechanical.
  repeated string mechanical_paths = 3;
  // Path patterns whose changes never raise a red flag.
  repeated string skipped_paths = 4;
}

// Owner and name empty: the global settings only.
message ReviewSettingsRequest {
  string owner = 1;
  string name = 2;
}

message ReviewSettingsReply {
  ReviewRules global = 1;
  // Present when a repository was asked for; its lists add to the global ones.
  ReviewRules repository = 2;
  reserved 3, 7, 8, 9;
  repeated string built_in_mechanical_paths = 4;
  string settings_path = 5;
  string repository_settings_path = 6;
}

// Owner and name empty: replaces the global settings. Otherwise replaces that repository's overrides.
message UpdateReviewSettingsRequest {
  string owner = 1;
  string name = 2;
  ReviewRules rules = 3;
}

// ===================================== v2 =====================================

// ---- Inbox (M1) ----

message ListInboxRequest {
  // Ask GitHub now rather than returning a result from the last poll.
  bool refresh = 1;
}

message WatchInboxRequest {}

enum InboxCheckState {
  INBOX_CHECK_STATE_NONE = 0;
  INBOX_CHECK_STATE_PENDING = 1;
  INBOX_CHECK_STATE_SUCCESS = 2;
  INBOX_CHECK_STATE_FAILURE = 3;
}

enum InboxReviewState {
  INBOX_REVIEW_STATE_AWAITING = 0;
  INBOX_REVIEW_STATE_APPROVED = 1;
  INBOX_REVIEW_STATE_CHANGES_REQUESTED = 2;
  // No review required (e.g. no branch protection) and none given.
  INBOX_REVIEW_STATE_NONE = 3;
}

message InboxItem {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 additions = 6;
  int32 deletions = 7;
  int32 changed_files = 8;
  bool is_draft = 9;
  InboxCheckState checks = 10;
  InboxReviewState review = 11;
  // Activity since the viewer last opened it in Lumen (or never opened).
  bool unread = 12;
  string url = 13;
  string head_sha = 14;
  // Never opened in Lumen.
  bool is_new = 15;
}

message InboxSection {
  // "review-requested", "mine", "watched".
  string id = 1;
  string title = 2;
  repeated InboxItem items = 3;
  // Why the section is empty, e.g. "Add repositories to watch in Settings".
  string detail = 4;
}

message Inbox {
  repeated InboxSection sections = 1;
  string viewer_login = 2;
  google.protobuf.Timestamp fetched_at = 3;
  // Set when GitHub could not be reached; sections then hold the last good result, if any.
  string error = 4;
  bool is_authentication_error = 5;
}

message GetInboxSettingsRequest {}

message InboxSettings {
  // "owner/name"
  repeated string watched_repositories = 1;
}

// ---- Pull request context (M2) ----

message GetPullRequestDetailsRequest {
  PullRequestRef pull_request = 1;
  // Ask GitHub now rather than returning what the session already has.
  bool refresh = 2;
}

message Label {
  string name = 1;
  // "rrggbb"
  string color = 2;
}

enum ReviewVerdict {
  REVIEW_VERDICT_COMMENTED = 0;
  REVIEW_VERDICT_APPROVED = 1;
  REVIEW_VERDICT_CHANGES_REQUESTED = 2;
  REVIEW_VERDICT_DISMISSED = 3;
  REVIEW_VERDICT_PENDING = 4;
}

message Reviewer {
  string login = 1;
  // A team review request ("org/team").
  bool is_team = 2;
  // Requested and not yet reviewed.
  bool is_requested = 3;
  ReviewVerdict verdict = 4;
  bool has_verdict = 5;
}

enum TimelineItemKind {
  TIMELINE_ITEM_KIND_COMMENT = 0;
  TIMELINE_ITEM_KIND_REVIEW = 1;
}

message TimelineItem {
  string id = 1;
  TimelineItemKind kind = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  string url = 6;
  // Reviews only.
  ReviewVerdict verdict = 7;
  int32 review_comment_count = 8;
}

message CommitInfo {
  string sha = 1;
  string headline = 2;
  string message = 3;
  string author = 4;
  google.protobuf.Timestamp authored_at = 5;
}

enum CheckState {
  CHECK_STATE_PENDING = 0;
  CHECK_STATE_SUCCESS = 1;
  CHECK_STATE_FAILURE = 2;
  CHECK_STATE_NEUTRAL = 3;
  CHECK_STATE_SKIPPED = 4;
  CHECK_STATE_CANCELLED = 5;
}

message CheckRun {
  string name = 1;
  CheckState state = 2;
  // Raw GitHub status/conclusion, e.g. "IN_PROGRESS", "TIMED_OUT".
  string detail = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  string url = 6;
  // A commit status (rather than a check run).
  bool is_status = 7;
}

enum Mergeability {
  MERGEABILITY_UNKNOWN = 0;
  MERGEABILITY_MERGEABLE = 1;
  MERGEABILITY_CONFLICTING = 2;
}

message PullRequestDetails {
  PullRequestRef pull_request = 1;
  string title = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  string state = 5;
  bool is_draft = 6;
  string base_ref = 7;
  string head_ref = 8;
  string head_sha = 9;
  Mergeability mergeability = 10;
  // GitHub's mergeStateStatus, e.g. "BLOCKED", "CLEAN", "BEHIND".
  string merge_state = 11;
  repeated Label labels = 12;
  repeated Reviewer reviewers = 13;
  repeated TimelineItem timeline = 14;
  repeated CommitInfo commits = 15;
  repeated CheckRun checks = 16;
  string viewer_login = 17;
  // The head at the viewer's last submitted review (GitHub, or a review submitted from Lumen), else at last open.
  string last_reviewed_sha = 18;
  // True when last_reviewed_sha came from opening the pull request, not from a review.
  bool last_reviewed_is_open = 19;
  string url = 20;
  google.protobuf.Timestamp created_at = 21;
}

message TimelineUpdated {
  repeated TimelineItem timeline = 1;
}

message ChecksUpdated {
  repeated CheckRun checks = 1;
  string head_sha = 2;
}

// New commits were pushed while the pull request was open. The app offers to reload.
message HeadChanged {
  string old_sha = 1;
  string new_sha = 2;
}

message GetDiffRangeRequest {
  PullRequestRef pull_request = 1;
  CommitRange range = 2;
  bool ignore_whitespace = 3;
}

message DiffRange {
  CommitRange range = 1;
  repeated ChangedFileSummary files = 2;
  // The old commit is not an ancestor of the new one (history was rewritten): file contents are compared directly.
  bool is_force_push = 3;
  // Shown to the reviewer, e.g. "History was rewritten since your last review; comparing file contents."
  string note = 4;
}

message PostIssueCommentRequest {
  PullRequestRef pull_request = 1;
  string body = 2;
}

// ---- Threads (M4) ----

message ThreadComment {
  string id = 1;
  int64 database_id = 2;
  string author = 3;
  // Markdown.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  string url = 6;
  // Part of the viewer's pending review (not yet visible to others).
  bool is_pending = 7;
}

message ReviewThread {
  string id = 1;
  string path = 2;
  DiffSide side = 3;
  // Current position at the head; 0 when the thread is outdated (its line no longer exists).
  int32 line = 4;
  int32 start_line = 5;
  // Position in the commit it was written against.
  int32 original_line = 6;
  int32 original_start_line = 7;
  string original_commit_sha = 8;
  bool is_resolved = 9;
  bool is_outdated = 10;
  repeated ThreadComment comments = 11;
  bool can_reply = 12;
  bool can_resolve = 13;
  bool can_unresolve = 14;
  // The diff hunk the first comment was written on, for outdated threads.
  string diff_hunk = 15;
}

message ThreadsUpdated {
  repeated ReviewThread threads = 1;
}

message ReplyToThreadRequest {
  PullRequestRef pull_request = 1;
  string thread_id = 2;
  string body = 3;
}

message SetThreadResolvedRequest {
  PullRequestRef pull_request = 1;
  string thread_id = 2;
  bool resolved = 3;
}

// ---- Pending review (M5) ----

message GetPendingReviewRequest {
  PullRequestRef pull_request = 1;
}

message PendingComment {
  string id = 1;
  string thread_id = 2;
  string path = 3;
  DiffSide side = 4;
  int32 line = 5;
  int32 start_line = 6;
  string body = 7;
  // A reply to an existing thread rather than a new one.
  bool is_reply = 8;
  reserved 9;
}

message PendingReview {
  // Empty when there is no pending review.
  string id = 1;
  string body = 2;
  repeated PendingComment comments = 3;
}

message AddPendingCommentRequest {
  PullRequestRef pull_request = 1;
  string path = 2;
  DiffSide side = 3;
  int32 line = 4;
  int32 start_line = 5;
  DiffSide start_side = 6;
  string body = 7;
  reserved 8;
  // Set to reply to an existing thread inside the pending review instead of starting a new one.
  string reply_to_thread_id = 9;
}

message UpdatePendingCommentRequest {
  PullRequestRef pull_request = 1;
  string comment_id = 2;
  string body = 3;
}

message DeletePendingCommentRequest {
  PullRequestRef pull_request = 1;
  string comment_id = 2;
}

enum ReviewEvent {
  REVIEW_EVENT_COMMENT = 0;
  REVIEW_EVENT_APPROVE = 1;
  REVIEW_EVENT_REQUEST_CHANGES = 2;
}

message SubmitReviewRequest {
  PullRequestRef pull_request = 1;
  ReviewEvent event = 2;
  string body = 3;
}

message SubmitReviewReply {
  string url = 1;
  // The head the review was submitted at (feeds "since last review").
  string head_sha = 2;
}

// ================================== overhaul ==================================

// ---- Feature slices (Phase 4) ----

enum SliceKind {
  // The code behind one entry point.
  SLICE_KIND_FEATURE = 0;
  // Reached from three or more slices; reviewed once.
  SLICE_KIND_SHARED = 1;
  // Changed code no seed reaches that unchanged code uses.
  SLICE_KIND_UNLINKED_USED = 2;
  // Changed code nothing uses.
  SLICE_KIND_UNLINKED_UNUSED = 3;
  // Files whose every change folds as mechanical: listed as groups, not read.
  SLICE_KIND_MECHANICAL_ONLY = 4;
}

// A link between two nodes (a file path, or "path::Type.Member"), always with its reason in words.
message SliceEdge {
  string from = 1;
  string to = 2;
  // e.g. "page loads `orders-edit.js`", "`EditModel` injects `IOrderService` → `OrderService`".
  string reason = 3;
  // A possible link: shown, never moves code into a slice.
  bool possible = 4;
}

message SliceFile {
  string path = 1;
  // Reading order inside the slice: entities and input models → data → services → page model → .cshtml → JS → tests.
  int32 order = 2;
  // Why the file is in the slice, e.g. "`EditModel` injects `IOrderService` → `OrderService`".
  string why = 3;
  // Changed members in this file that belong to the slice ("Type.Member"); empty when the whole file does.
  repeated string members = 4;
  // Handler sub-section ("OnGet", "OnPostSave"); empty when the slice is not split.
  string section = 5;
  // Unchanged code that uses this file (Unlinked: "Used outside this change").
  int32 outside_callers = 6;
}

message Slice {
  string id = 1;
  string title = 2;
  SliceKind kind = 3;
  string seed_path = 4;
  repeated SliceFile files = 5;
  // Handler sub-sections in order, for large slices.
  repeated string sections = 6;
  repeated SliceEdge possible_links = 7;
  // Links to other pages (asp-page, RedirectToPage, Url.Page): shown, they never merge slices.
  repeated SliceEdge page_links = 8;
}

message SlicesReady {
  repeated Slice slices = 1;
  // Every membership edge, for "why this file is here".
  repeated SliceEdge edges = 2;
  // Slicing failed, ran past its budget or the repository isn't Razor/WebForms-shaped: the file list stays.
  bool fell_back = 3;
  string fallback_reason = 4;
  int64 duration_ms = 5;
  // Fingerprint of each unit's normalised changed lines (unit = path, or "path::Type.Member" in a large file).
  repeated UnitFingerprint units = 6;
}

message UnitFingerprint {
  string unit = 1;
  string path = 2;
  string fingerprint = 3;
  // Changed lines left open in this unit.
  int32 open_lines = 4;
}

// ---- Red flags (Phase 7) ----

enum FlagKind {
  FLAG_KIND_WEAKENED_TESTS = 0;
  FLAG_KIND_ANTIFORGERY_OFF = 1;
  FLAG_KIND_AUTHORISATION_LOOSENED = 2;
  FLAG_KIND_OVER_POSTING = 3;
  FLAG_KIND_GUARD_REMOVED = 4;
  FLAG_KIND_RAW_OUTPUT = 5;
  FLAG_KIND_RAW_SQL = 6;
  FLAG_KIND_QUERY_SAFETY = 7;
  FLAG_KIND_SWALLOWED_ERRORS = 8;
  FLAG_KIND_WARNINGS_SILENCED = 9;
  FLAG_KIND_DEPENDENCIES_AND_BUILD = 10;
  FLAG_KIND_SECURITY_CONFIG = 11;
}

message RedFlag {
  // Identity: (kind, member, normalised line). Stable across pushes, so since-my-last-look can say Fixed / New.
  string id = 1;
  FlagKind kind = 2;
  string path = 3;
  DiffSide side = 4;
  int32 line = 5;
  // Only what the detector found, e.g. "`[IgnoreAntiforgeryToken]` added".
  string message = 6;
  string member = 7;
}

message FlagsReady {
  repeated RedFlag flags = 1;
}

// ---- Tracking (Phase 6) ----

message ReviewMark {
  string unit = 1;
  // The unit's fingerprint when it was marked; a different current fingerprint means it changed since.
  string fingerprint = 2;
}

message MarksUpdated {
  repeated ReviewMark marks = 1;
  // Files whose GitHub Viewed box was ticked by this change.
  repeated string viewed_paths = 2;
}

message SetMarkedRequest {
  PullRequestRef pull_request = 1;
  repeated string units = 2;
  bool marked = 3;
}

message GetSinceLastLookRequest {
  PullRequestRef pull_request = 1;
}

message SinceLastLook {
  // The head last looked at; empty when there has been no look yet.
  string old_head_sha = 1;
  string new_head_sha = 2;
  // The old head no longer exists (a force-push): file contents were compared instead.
  bool history_rewritten = 3;
  string note = 4;
  // Files whose patch changed, each reduced to the diff from the old head.
  repeated FileDiff files = 5;
  // Flag ids new since the last look, and ids that were there and are now gone.
  repeated string new_flag_ids = 6;
  repeated RedFlag fixed_flags = 7;
}

// ---- Local branches (Phase 2) ----

message ListLocalBranchesRequest {}

message LocalBranchItem {
  LocalBranchRef ref = 1;
  string display_name = 2;
  google.protobuf.Timestamp last_opened_at = 3;
}

message LocalBranches {
  repeated LocalBranchItem items = 1;
}
